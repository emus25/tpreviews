<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>TP Improvements Reviews</title>

  <style>
    :root {
      --main-background: rgb(29, 54, 68);
      --button-colour: rgb(185, 139, 98);
      --text-colour: #ffffff;
      --soft-text: rgba(255, 255, 255, 0.88);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--main-background);
      color: var(--text-colour);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.28);
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .content {
      padding: 28px 22px 30px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .subtitle {
      margin: 12px auto 24px;
      max-width: 340px;
      color: var(--soft-text);
      font-size: 16px;
      line-height: 1.55;
    }

    .save-contact {
      display: block;
      width: 100%;
      margin: 0 auto 24px;
      padding: 16px 18px;
      border-radius: 16px;
      background: #ffffff;
      color: var(--main-background);
      text-decoration: none;
      font-weight: 800;
      font-size: 16px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
    }

    .save-contact span {
      color: var(--button-colour);
    }

    .stars {
      margin-bottom: 24px;
      color: var(--button-colour);
      font-size: 24px;
      letter-spacing: 3px;
    }

    .review-links {
      display: grid;
      gap: 14px;
    }

    .review-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      padding: 17px 18px;
      border-radius: 16px;
      background: var(--button-colour);
      color: var(--text-colour);
      text-decoration: none;
      font-weight: 700;
      font-size: 17px;
      transition: 0.2s ease;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.2);
    }

    .review-button:hover,
    .save-contact:hover {
      transform: translateY(-2px);
    }

    .button-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .arrow {
      font-size: 22px;
    }

    @media (max-width: 420px) {
      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card">

      <!-- CHANGE THIS IMAGE FILE NAME IF NEEDED -->
      <div class="cover">
        <img src="./cover (10).png" alt="TP Improvements logo">
      </div>

      <div class="content">

        <!-- SAVE CONTACT BUTTON -->
        <a class="save-contact" href="tpimprovements.vcf" download>
          Click here to <span>keep in contact with us</span>
        </a>

        <h1>We Appreciate Your Feedback</h1>

        <p class="subtitle">
          Please leave us a review on one or more of the platforms below.
        </p>

        <div class="stars">★★★★★</div>

        <div class="review-links">

          <!-- REPLACE THIS WITH TP HOME IMPROVEMENTS GOOGLE REVIEW LINK -->
          <a class="review-button" href="https://g.page/r/CYzspMX8xq-WEAI/review" target="_blank" rel="noopener noreferrer">
            <span class="button-left">
              <span class="icon">G</span>
              Google Reviews
            </span>
            <span class="arrow">›</span>
          </a>

          <!-- DELETE THIS BUTTON IF THEY DO NOT USE CHECKATRADE -->
          <a class="review-button" href="https://www.checkatrade.com/give-feedback/trades/tpimprovementsltd" target="_blank" rel="noopener noreferrer">
            <span class="button-left">
              <span class="icon">✓</span>
              Checkatrade Reviews
            </span>
            <span class="arrow">›</span>
          </a>

          <!-- DELETE THIS BUTTON IF THEY DO NOT USE TRUSTPILOT -->
          <a class="review-button" href="https://public.trustindex.io/review/write/tpimprovements.com" target="_blank" rel="noopener noreferrer">
            <span class="button-left">
              <span class="icon">★</span>
              Trustindex Reviews
            </span>
            <span class="arrow">›</span>
          </a>

        </div>

      </div>
    </section>
  </main>
</body>
</html>
